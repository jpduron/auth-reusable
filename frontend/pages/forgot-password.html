<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-envelope-paper display-3 text-warning"></i>
                            <h3 class="mt-2">¿Olvidaste tu contraseña?</h3>
                            <p class="text-muted">Ingresa tu correo y te enviaremos un enlace para restablecerla</p>
                        </div>

                        <div id="alert" class="alert d-none" role="alert"></div>

                        <form id="forgotForm">
                            <div class="mb-3">
                                <label for="correo" class="form-label">
                                    <i class="bi bi-envelope"></i> Correo electrónico
                                </label>
                                <input 
                                    type="email" 
                                    class="form-control" 
                                    id="correo" 
                                    name="correo"
                                    required
                                    autocomplete="email"
                                    placeholder="tu@correo.com"
                                >
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-warning" id="btnForgot">
                                    <span class="spinner-border spinner-border-sm d-none" id="spinner"></span>
                                    Enviar Enlace de Recuperación
                                </button>
                            </div>
                        </form>

                        <hr class="my-4">
                        
                        <div class="text-center">
                            <a href="login.html" class="text-decoration-none">
                                <i class="bi bi-arrow-left"></i> Volver al login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/modules/api.js"></script>
    <script src="../assets/js/modules/auth.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const alert = document.getElementById('alert');
            const btnForgot = document.getElementById('btnForgot');
            const spinner = document.getElementById('spinner');
            
            alert.classList.add('d-none');
            btnForgot.disabled = true;
            spinner.classList.remove('d-none');

            const correo = document.getElementById('correo').value.trim();

            const result = await Auth.forgotPassword(correo);

            btnForgot.disabled = false;
            spinner.classList.add('d-none');

            if (result.success) {
                alert.className = 'alert alert-success';
                alert.innerHTML = `
                    <strong>¡Correo enviado!</strong><br>
                    ${result.message}<br>
                    <small>Revisa tu bandeja de entrada y la carpeta de spam.</small>
                `;
                alert.classList.remove('d-none');
                
                // Deshabilitar el formulario después del éxito
                document.getElementById('correo').disabled = true;
                btnForgot.disabled = true;
            } else {
                alert.className = 'alert alert-danger';
                alert.textContent = result.message;
                alert.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
