<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100 py-4">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-plus-fill display-3 text-primary"></i>
                            <h3 class="mt-2">Crear Cuenta</h3>
                            <p class="text-muted">Completa tus datos para registrarte</p>
                        </div>

                        <div id="alert" class="alert d-none" role="alert"></div>

                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="nombre_completo" class="form-label">
                                    <i class="bi bi-person"></i> Nombre completo
                                </label>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="nombre_completo" 
                                    name="nombre_completo"
                                    required
                                    autocomplete="name"
                                    placeholder="Ej: Juan Pablo García"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label">
                                    <i class="bi bi-envelope"></i> Correo electrónico
                                </label>
                                <input 
                                    type="email" 
                                    class="form-control" 
                                    id="correo" 
                                    name="correo"
                                    required
                                    autocomplete="email"
                                    placeholder="tu@correo.com"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="bi bi-key"></i> Contraseña
                                </label>
                                <input 
                                    type="password" 
                                    class="form-control" 
                                    id="password" 
                                    name="password"
                                    required
                                    autocomplete="new-password"
                                    minlength="8"
                                    placeholder="Mínimo 8 caracteres"
                                >
                                <div class="form-text">Debe tener al menos 8 caracteres</div>
                            </div>

                            <div class="mb-3">
                                <label for="password_confirm" class="form-label">
                                    <i class="bi bi-key-fill"></i> Confirmar contraseña
                                </label>
                                <input 
                                    type="password" 
                                    class="form-control" 
                                    id="password_confirm" 
                                    name="password_confirm"
                                    required
                                    autocomplete="new-password"
                                    placeholder="Repite tu contraseña"
                                >
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary" id="btnRegister">
                                    <span class="spinner-border spinner-border-sm d-none" id="spinner"></span>
                                    Crear Cuenta
                                </button>
                            </div>

                            <div class="text-center">
                                <small class="text-muted">
                                    Al registrarte, recibirás un correo para verificar tu cuenta.
                                </small>
                            </div>
                        </form>

                        <hr class="my-4">
                        
                        <div class="text-center">
                            <small class="text-muted">
                                ¿Ya tienes cuenta? 
                                <a href="login.html">Inicia sesión aquí</a>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/modules/api.js"></script>
    <script src="../assets/js/modules/auth.js"></script>
    <script>
        // Si ya está autenticado, redirigir al dashboard
        if (Auth.isAuthenticated()) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const alert = document.getElementById('alert');
            const btnRegister = document.getElementById('btnRegister');
            const spinner = document.getElementById('spinner');
            
            alert.classList.add('d-none');
            btnRegister.disabled = true;
            spinner.classList.remove('d-none');

            const nombreCompleto = document.getElementById('nombre_completo').value.trim();
            const correo = document.getElementById('correo').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password_confirm').value;

            // Validación del lado del cliente
            if (password !== passwordConfirm) {
                alert.className = 'alert alert-danger';
                alert.textContent = 'Las contraseñas no coinciden.';
                alert.classList.remove('d-none');
                btnRegister.disabled = false;
                spinner.classList.add('d-none');
                return;
            }

            if (password.length < 8) {
                alert.className = 'alert alert-danger';
                alert.textContent = 'La contraseña debe tener al menos 8 caracteres.';
                alert.classList.remove('d-none');
                btnRegister.disabled = false;
                spinner.classList.add('d-none');
                return;
            }

            const result = await Auth.register(nombreCompleto, correo, password);

            btnRegister.disabled = false;
            spinner.classList.add('d-none');

            if (result.success) {
                alert.className = 'alert alert-success';
                alert.innerHTML = `
                    <strong>¡Registro exitoso!</strong><br>
                    ${result.message}<br>
                    <small>Redirigiendo al login en 3 segundos...</small>
                `;
                alert.classList.remove('d-none');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            } else {
                alert.className = 'alert alert-danger';
                alert.textContent = result.message;
                alert.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
