<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .verify-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .verify-card { max-width: 500px; width: 100%; text-align: center; padding: 2rem; }
        .icon-success { font-size: 4rem; color: #198754; }
        .icon-error { font-size: 4rem; color: #dc3545; }
        .spinner-container { display: none; }
    </style>
</head>
<body class="bg-light">
    <div class="container verify-container">
        <div class="card shadow-sm verify-card">
            
            <!-- Estado: Cargando -->
            <div id="loadingState" class="spinner-container">
                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Cargando...</span>
                </div>
                <h4 class="mt-3">Verificando tu cuenta...</h4>
                <p class="text-muted">Por favor espera un momento.</p>
            </div>

            <!-- Estado: Éxito -->
            <div id="successState" class="d-none">
                <i class="bi bi-check-circle-fill icon-success"></i>
                <h3 class="mt-3 text-success">¡Cuenta Verificada!</h3>
                <p class="text-muted">Tu correo ha sido verificado exitosamente. Ya puedes iniciar sesión en el sistema.</p>
                <a href="login.html" class="btn btn-primary btn-lg mt-3">
                    <i class="bi bi-box-arrow-in-right"></i> Ir al Login
                </a>
            </div>

            <!-- Estado: Error -->
            <div id="errorState" class="d-none">
                <i class="bi bi-x-circle-fill icon-error"></i>
                <h3 class="mt-3 text-danger">Verificación Fallida</h3>
                <p id="errorMessage" class="text-muted">El enlace no es válido o ya ha sido utilizado.</p>
                <a href="login.html" class="btn btn-outline-secondary mt-3">
                    <i class="bi bi-arrow-left"></i> Volver al Login
                </a>
            </div>

        </div>
    </div>

    <script src="../assets/js/modules/api.js"></script>
    <script src="../assets/js/modules/auth.js"></script>
    <script>
        // 1. Obtener el token de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // 2. Elementos del DOM
        const loadingState = document.getElementById('loadingState');
        const successState = document.getElementById('successState');
        const errorState = document.getElementById('errorState');
        const errorMessage = document.getElementById('errorMessage');

        // 3. Función principal
        async function verifyAccount() {
            if (!token) {
                showState('error', 'No se encontró el token de verificación en el enlace.');
                return;
            }

            // Mostrar cargando
            loadingState.style.display = 'block';

            try {
                // Llamar al endpoint de verificación del backend
                const result = await Auth.verifyEmail(token);

                if (result.success) {
                    showState('success');
                } else {
                    showState('error', result.message || 'El enlace no es válido o ya ha sido utilizado.');
                }
            } catch (error) {
                showState('error', 'Ocurrió un error de conexión. Intenta nuevamente más tarde.');
            }
        }

        // 4. Función para cambiar el estado visible
        function showState(state, message = '') {
            loadingState.style.display = 'none';
            
            if (state === 'success') {
                successState.classList.remove('d-none');
            } else {
                errorState.classList.remove('d-none');
                if (message) errorMessage.textContent = message;
            }
        }

        // Ejecutar al cargar la página
        verifyAccount();
    </script>
</body>
</html>
