<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-shield-lock display-3 text-success"></i>
                            <h3 class="mt-2">Nueva Contraseña</h3>
                            <p class="text-muted">Ingresa tu nueva contraseña</p>
                        </div>

                        <div id="alert" class="alert d-none" role="alert"></div>

                        <form id="resetForm">
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="bi bi-key"></i> Nueva contraseña
                                </label>
                                <input 
                                    type="password" 
                                    class="form-control" 
                                    id="password" 
                                    name="password"
                                    required
                                    autocomplete="new-password"
                                    minlength="8"
                                    placeholder="Mínimo 8 caracteres"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="password_confirm" class="form-label">
                                    <i class="bi bi-key-fill"></i> Confirmar contraseña
                                </label>
                                <input 
                                    type="password" 
                                    class="form-control" 
                                    id="password_confirm" 
                                    name="password_confirm"
                                    required
                                    autocomplete="new-password"
                                    placeholder="Repite tu contraseña"
                                >
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-success" id="btnReset">
                                    <span class="spinner-border spinner-border-sm d-none" id="spinner"></span>
                                    Restablecer Contraseña
                                </button>
                            </div>
                        </form>

                        <hr class="my-4">
                        
                        <div class="text-center">
                            <a href="login.html" class="text-decoration-none">
                                <i class="bi bi-arrow-left"></i> Volver al login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/modules/api.js"></script>
    <script src="../assets/js/modules/auth.js"></script>
    <script>
        // Obtener el token de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Si no hay token, redirigir al login
        if (!token) {
            window.location.href = 'login.html';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const alert = document.getElementById('alert');
            const btnReset = document.getElementById('btnReset');
            const spinner = document.getElementById('spinner');
            
            alert.classList.add('d-none');
            btnReset.disabled = true;
            spinner.classList.remove('d-none');

            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password_confirm').value;

            // Validación del lado del cliente
            if (password !== passwordConfirm) {
                alert.className = 'alert alert-danger';
                alert.textContent = 'Las contraseñas no coinciden.';
                alert.classList.remove('d-none');
                btnReset.disabled = false;
                spinner.classList.add('d-none');
                return;
            }

            if (password.length < 8) {
                alert.className = 'alert alert-danger';
                alert.textContent = 'La contraseña debe tener al menos 8 caracteres.';
                alert.classList.remove('d-none');
                btnReset.disabled = false;
                spinner.classList.add('d-none');
                return;
            }

            const result = await Auth.resetPassword(token, password);

            btnReset.disabled = false;
            spinner.classList.add('d-none');

            if (result.success) {
                alert.className = 'alert alert-success';
                alert.innerHTML = `
                    <strong>¡Contraseña actualizada!</strong><br>
                    ${result.message}<br>
                    <small>Redirigiendo al login en 3 segundos...</small>
                `;
                alert.classList.remove('d-none');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            } else {
                alert.className = 'alert alert-danger';
                alert.textContent = result.message;
                alert.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
