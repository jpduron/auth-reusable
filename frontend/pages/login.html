<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-shield-lock-fill display-3 text-primary"></i>
                            <h3 class="mt-2">Iniciar Sesión</h3>
                            <p class="text-muted">Ingresa tus credenciales</p>
                        </div>

                        <!-- Alerta de mensajes -->
                        <div id="alert" class="alert d-none" role="alert"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="correo" class="form-label">
                                    <i class="bi bi-envelope"></i> Correo electrónico
                                </label>
                                <input 
                                    type="email" 
                                    class="form-control" 
                                    id="correo" 
                                    name="correo"
                                    required
                                    autocomplete="email"
                                    placeholder="tu@correo.com"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="bi bi-key"></i> Contraseña
                                </label>
                                <div class="input-group">
                                    <input 
                                        type="password" 
                                        class="form-control" 
                                        id="password" 
                                        name="password"
                                        required
                                        autocomplete="current-password"
                                        placeholder="••••••••"
                                    >
                                    <button 
                                        class="btn btn-outline-secondary" 
                                        type="button" 
                                        id="togglePassword"
                                    >
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary" id="btnLogin">
                                    <span class="spinner-border spinner-border-sm d-none" id="spinner"></span>
                                    Iniciar Sesión
                                </button>
                            </div>

                            <div class="text-center">
                                <a href="forgot-password.html" class="text-decoration-none">
                                    ¿Olvidaste tu contraseña?
                                </a>
                            </div>
                        </form>

                        <hr class="my-4">
                        
                        <div class="text-center">
                            <small class="text-muted">
                                ¿No tienes cuenta? 
                                <a href="register.html">Regístrate aquí</a>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/modules/api.js"></script>
    <script src="../assets/js/modules/auth.js"></script>
    <script>
        // Si ya está autenticado, redirigir al dashboard
        if (Auth.isAuthenticated()) {
            window.location.href = 'dashboard.html';
        }

        // Toggle para mostrar/ocultar contraseña
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });

        // Manejo del formulario
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const alert = document.getElementById('alert');
            const btnLogin = document.getElementById('btnLogin');
            const spinner = document.getElementById('spinner');
            
            // Limpiar alertas previas
            alert.classList.add('d-none');
            
            // Mostrar spinner
            btnLogin.disabled = true;
            spinner.classList.remove('d-none');

            const correo = document.getElementById('correo').value.trim();
            const password = document.getElementById('password').value;

            const result = await Auth.login(correo, password);

            // Ocultar spinner
            btnLogin.disabled = false;
            spinner.classList.add('d-none');

            if (result.success) {
                alert.className = 'alert alert-success';
                alert.textContent = '¡Bienvenido! Redirigiendo...';
                alert.classList.remove('d-none');
                
                // Redirigir al dashboard después de 1 segundo
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                alert.className = 'alert alert-danger';
                alert.textContent = result.message;
                alert.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
