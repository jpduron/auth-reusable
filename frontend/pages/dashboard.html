<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-shield-check"></i> Mi Aplicación
            </a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3" id="userName">Cargando...</span>
                <button class="btn btn-outline-light btn-sm" id="btnLogout">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <!-- Contenido -->
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title">
                            <i class="bi bi-speedometer2"></i> Panel de Control
                        </h2>
                        <hr>
                        
                        <div id="userInfo">
                            <p><strong>Nombre:</strong> <span id="displayName">-</span></p>
                            <p><strong>Correo:</strong> <span id="displayEmail">-</span></p>
                            <p><strong>Rol:</strong> <span id="displayRole">-</span></p>
                            <p><strong>Super Usuario:</strong> <span id="displaySU">-</span></p>
                            <p><strong>Última sesión:</strong> <span id="displayLastLogin">-</span></p>
                        </div>

                        <div class="alert alert-info mt-4">
                            <i class="bi bi-info-circle"></i>
                            ¡Felicidades! Has conectado exitosamente tu frontend con tu backend PHP 8.3.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/modules/api.js"></script>
    <script src="../assets/js/modules/auth.js"></script>
    <script>
        // Proteger esta página (requiere autenticación)
        (async () => {
            const isAuth = await Auth.requireAuth();
            if (!isAuth) return;

            // Cargar datos del usuario
            const user = Auth.getUserData();
            if (user) {
                document.getElementById('userName').textContent = user.nombre_completo;
                document.getElementById('displayName').textContent = user.nombre_completo;
                document.getElementById('displayEmail').textContent = user.correo;
                document.getElementById('displayRole').textContent = user.rol_id === 1 ? 'Administrador' : 'Usuario';
                document.getElementById('displaySU').textContent = user.es_su ? 'Sí' : 'No';
                document.getElementById('displayLastLogin').textContent = user.ultima_sesion_el || 'N/A';
            }
        })();

        // Botón de logout
        document.getElementById('btnLogout').addEventListener('click', () => {
            if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                Auth.logout();
            }
        });
    </script>
</body>
</html>
